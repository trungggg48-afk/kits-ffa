name: Build HyperFFA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: HyperFFA-main/HyperFFA-main
        run: mvn clean package -DskipTests

      - name: Upload HyperFFA.jar
        uses: actions/upload-artifact@v4
        with:
          name: HyperFFA
          path: HyperFFA-main/HyperFFA-main/target/*.jar
